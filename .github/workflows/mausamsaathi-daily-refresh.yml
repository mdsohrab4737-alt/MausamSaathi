name: MausamSaathi Daily Scientific Refresh

on:
  schedule:
    # GitHub Actions cron is UTC. 02:30 UTC = 08:00 IST.
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: mausamsaathi-daily-refresh
  cancel-in-progress: false

permissions:
  contents: read

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright

jobs:
  daily-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_BUCKET: mausamsaathi-scientific
      CDSAPI_RC: ${{ secrets.CDSAPI_RC }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-cloud-refresh.txt

      - name: Install cloud refresh dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-cloud-refresh.txt

      - name: Install Chromium and Linux browser dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Run cloud refresh
        run: |
          python backend/cloud_refresh_worker.py

